name: food-beverage-copilot

services:
  db:
    image: pgvector/pgvector:0.8.7-pg18-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-Food_Beverage}
      POSTGRES_USER: ${DB_USER:-food_app}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD debe estar configurada en .env}
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks: [backend]

  migrate:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["python", "scripts/init_database.py"]
    env_file: [.env]
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_ADMIN_NAME: postgres
      DB_SSLMODE: disable
    depends_on:
      db:
        condition: service_healthy
    restart: "no"
    networks: [backend]

  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: [.env]
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_ADMIN_NAME: postgres
      DB_SSLMODE: disable
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-1}
    ports:
      - "${APP_PORT:-5000}:5000"
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/health', timeout=5)"]
      interval: 30s
      timeout: 8s
      retries: 3
      start_period: 20s
    networks: [backend]

volumes:
  postgres_data:
    name: food_beverage_postgres_data

networks:
  backend:
    name: food_beverage_backend
    driver: bridge
