name: food-beverage-copilot

services:
  db:
    image: pgvector/pgvector:0.8.7-pg18-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-Food_Beverage}
      POSTGRES_USER: ${DB_USER:-food_app}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD debe estar configurada en .env}
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks: [backend]

  migrate:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["python", "scripts/init_database.py"]
    env_file: [.env]
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_ADMIN_NAME: postgres
      DB_SSLMODE: disable
    depends_on:
      db:
        condition: service_healthy
    restart: "no"
    networks: [backend]

  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: [.env]
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_ADMIN_NAME: postgres
      DB_SSLMODE: disable
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-1}
      APP_TIMEZONE: ${APP_TIMEZONE:-America/Bogota}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      OLLAMA_CHAT_MODEL: ${OLLAMA_CHAT_MODEL:-llama3.1:8b}
      OLLAMA_EMBED_MODEL: ${OLLAMA_EMBED_MODEL:-nomic-embed-text}
      OLLAMA_TIMEOUT: ${OLLAMA_TIMEOUT:-300}
      OLLAMA_MAX_TOKENS: ${OLLAMA_MAX_TOKENS:-220}
      PREDICTIVE_CHAT_MAX_TOKENS: ${PREDICTIVE_CHAT_MAX_TOKENS:-360}
      SESSION_IDLE_TIMEOUT_SECONDS: ${SESSION_IDLE_TIMEOUT_SECONDS:-1800}
    ports:
      - "${APP_PORT:-5000}:5000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/health', timeout=5)"]
      interval: 30s
      timeout: 8s
      retries: 3
      start_period: 20s
    networks: [backend]

  collector:
    build:
      context: .
      dockerfile: Dockerfile
    command:
      - python
      - -m
      - flask
      - --app
      - app
      - run-reading-collector
      - --interval-seconds
      - ${PREDICTIVE_CAPTURE_INTERVAL:-900}
    restart: unless-stopped
    env_file: [.env]
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_ADMIN_NAME: postgres
      DB_SSLMODE: disable
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      app:
        condition: service_healthy
    healthcheck:
      disable: true
    networks: [backend]

  downtime-collector:
    build:
      context: .
      dockerfile: Dockerfile
    command:
      - python
      - -m
      - flask
      - --app
      - app
      - run-downtime-collector
      - --interval-seconds
      - ${DOWNTIME_CAPTURE_INTERVAL:-900}
      - --probability
      - ${DOWNTIME_EVENT_PROBABILITY:-0.35}
    restart: unless-stopped
    env_file: [.env]
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_ADMIN_NAME: postgres
      DB_SSLMODE: disable
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      app:
        condition: service_healthy
    healthcheck:
      disable: true
    networks: [backend]

volumes:
  postgres_data:
    name: food_beverage_postgres_data

networks:
  backend:
    name: food_beverage_backend
    driver: bridge
