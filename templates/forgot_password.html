<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Recuperar contraseña · ZYMA 360</title><style>
:root{--green:#18794e;--bright:#33c27f;--ink:#17251e;--muted:#637069;--line:#dbe4df;--danger:#c93737}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:radial-gradient(circle at 75% 20%,#dff5e9,transparent 35%),#f2f7f4;font:14px/1.45 Inter,Segoe UI,Arial;color:var(--ink)}main{width:min(400px,100%)}.logo{display:block;width:140px;height:105px;object-fit:contain;margin:0 auto 8px}.card{background:#fff;border:1px solid var(--line);border-radius:20px;padding:26px;box-shadow:0 24px 60px #102b211c}h1{font-size:22px;margin:0 0 5px}p{color:var(--muted)}label{display:block;font-size:12px;font-weight:750;margin:18px 0 5px}input{width:100%;padding:12px;border:1px solid #cad8d1;border-radius:10px;outline:none}input:focus{border-color:var(--bright);box-shadow:0 0 0 3px #33c27f20}button{width:100%;border:0;border-radius:11px;padding:12px;margin-top:16px;background:linear-gradient(90deg,var(--green),var(--bright));color:#fff;font-weight:800;cursor:pointer}.message{display:none;padding:11px;border-radius:9px;margin-top:13px}.message.ok{display:block;background:#dff5e9;color:var(--green)}.message.error{display:block;background:#fde7e7;color:var(--danger)}a{display:block;text-align:center;margin-top:15px;color:var(--green);font-weight:700;text-decoration:none}
</style></head><body><main><img class="logo" src="{{ url_for('static',filename='images/zyma360-logo.png') }}" alt="ZYMA 360"><section class="card"><h1>Recupera tu contraseña</h1><p>Te enviaremos un enlace seguro si el correo está registrado.</p><form id="form"><label for="email">Correo electrónico</label><input id="email" type="email" autocomplete="email" required><button id="submit">Enviar enlace</button><div class="message" id="message"></div></form><a href="/login">Volver a iniciar sesión</a></section></main><script>
const form=document.getElementById('form'),button=document.getElementById('submit'),message=document.getElementById('message');form.addEventListener('submit',async e=>{e.preventDefault();button.disabled=true;try{const r=await fetch('/api/auth/forgot-password',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:document.getElementById('email').value})});const body=await r.json();if(!r.ok)throw new Error(body.error);message.textContent=body.message;message.className='message ok';form.reset()}catch(err){message.textContent=err.message;message.className='message error'}finally{button.disabled=false}});
</script></body></html>
